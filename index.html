<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamba Team</title>
  <link rel="stylesheet" href="./build/index.css">
  <script src="js/main.js"></script>

</head>

<body class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="header__brand">
      <img src="img/logo.png" alt="Logo Mamba Team" class="header__logo">
      <h1 class="header__title">Mamba Team</h1>
    </div>

    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__item"><a class="nav__link" href="index.html">Home</a></li>
        <li class="nav__item"><a class="nav__link" href="#">Equipo</a></li>
        <li class="nav__item"><a class="nav__link" href="#">Jugador</a></li>
      </ul>
    </nav>

    <button class="header__menu">
      <span class="header__menu-line"></span>
      <span class="header__menu-line"></span>
      <span class="header__menu-line"></span>
    </button>
  </header>

 
  <!-- SLIDER -->
  <div class="slider">
    <button class="slider__btn slider__btn--prev">❮</button>
  
    <div class="slider__content">
      <img src="img/slider1.jpg" class="slider__img" alt="">
      <img src="img/slider2.jpg" class="slider__img" alt="">
      <img src="img/slider3.jpg" class="slider__img" alt="">
    </div>
  
    <button class="slider__btn slider__btn--next">❯</button>
  </div>
  

<!-- GAME CARDS -->
<main class="games">
  <h2 class="games__title">Próximos partidos:</h2>

  <div class="cards"> 
    <div class="card">
      <img class="card__img" src="img/a1.png" alt="A1">
      <a class="card__btn" href="equipo.html">Ver equipo</a>
    </div>

    <div class="card">
      <img class="card__img" src="img/a2fem.png" alt="A2 Fem">
      <a class="card__btn" href="femenino.html">Ver equipo</a>
    </div>

    <div class="card">
      <img class="card__img" src="img/3a.png" alt="3a Arag">
      <a class="card__btn" href="tercera.html">Ver equipo</a>
    </div>
  </div>
</main>



  


</body>
</html>
